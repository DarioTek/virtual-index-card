{% extends "base.html" %}
{% block title %}Create account · Virtual Index Cards{% endblock %}
{% block content %}
<section class="auth-panel">
  <h1>Create an account</h1>
  <p>Each account has its own private deck.</p>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="auth-form">
    <label for="username">Username</label>
    <input id="username" name="username" required minlength="3" maxlength="30"
           pattern="[A-Za-z0-9_-]+" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="8"
           autocomplete="new-password">
    <button type="submit">Create account</button>
  </form>
  <p>Already registered? <a href="/login">Log in</a>.</p>
</section>
{% endblock %}
